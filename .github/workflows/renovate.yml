name: Renovate

on:
  # Twice a day (cron is UTC: 08:00/16:00 Rome in summer, 07:00/15:00 in
  # winter, so the Monday run stays inside "before 9am" year-round), so
  # security fixes and Dependency Dashboard requests land the same day;
  # regular updates are limited to Monday morning by the schedule in config.js.
  schedule:
    - cron: "0 6,14 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (log what would happen, open no PRs)"
        type: boolean
        default: false

concurrency: renovate

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Renovate
        if: ${{ !inputs.dryRun }}
        uses: renovatebot/github-action@v46.3.9
        with:
          configurationFile: config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Actions logs of a public repo are public: keep them quiet.
          LOG_LEVEL: warn

      - name: Renovate (dry run)
        if: ${{ inputs.dryRun }}
        uses: renovatebot/github-action@v46.3.9
        with:
          configurationFile: config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_DRY_RUN: full
